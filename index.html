<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nolan's Goal Tracker</title>
<meta name="theme-color" content="#16141E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nolan's Tracker">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Firebase (compat SDKs — simplest to wire up on top of a vanilla-JS app like this one) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-messaging-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
svg{display:block;}
html,body{height:100%;font-family:'Inter',-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;}

/* ── Game palette — same colors, warmer dark ── */
:root{
  --bg:#16141E;
  --card:#221F2E;
  --card2:#2C2840;
  --overlay-rgb:255,255,255;
  --tint-rgb:30,26,46;
  --glass:rgba(var(--overlay-rgb),0.06);
  --border:rgba(var(--overlay-rgb),0.1);
  --glow:rgba(197,165,114,0.15);
  --text:#F5F5F7;
  --sub:#9B97B0;
  --muted:#5E5A72;
  --gold:#C5A572;
  --goldbright:#D4B87A;
  --red:#C41E3A;
  --blue:#4A90D9;
  --purple:#9B72CF;
  --amber:#F59E0B;
  --green:#30D158;
  --r:22px;
  --r-sm:14px;
}
body{background:var(--bg);color:var(--text);}

/* ── Light mode override — same accent colors, swapped base surfaces ── */
html[data-theme="light"]{
  --bg:#F5F3EF;
  --card:#FFFFFF;
  --card2:#EDEAE3;
  --overlay-rgb:0,0,0;
  --tint-rgb:255,255,255;
  --glass:rgba(0,0,0,0.045);
  --border:rgba(0,0,0,0.1);
  --glow:rgba(197,165,114,0.18);
  --text:#1C1A22;
  --sub:#5B5770;
  --muted:#8B8798;
}
html[data-theme="light"] .verse-screen{background:#16141E !important;} /* verse splash stays dark/dramatic in both modes */
#app{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;
  background:var(--bg);padding-top:env(safe-area-inset-top,0px);}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:14px 14px 20px;}
::-webkit-scrollbar{width:0;}

/* ── Game Bottom Nav ── */
.bot-nav{display:flex;gap:6px;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--card);flex-shrink:0;border-top:1px solid var(--border);}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;padding:6px 4px;
  border-radius:var(--r-sm);transition:background .15s;}
.ni.on{background:var(--glass);}
.ni-ico{font-size:20px;line-height:1;}
.ni-lbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.ni.on .ni-lbl{color:var(--gold);}

/* ── Topbar ── */
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px 8px;
  border-bottom:1px solid var(--border);flex-shrink:0;}
.back{background:none;border:none;color:var(--blue);font-size:16px;font-family:inherit;
  font-weight:600;cursor:pointer;padding:4px 8px 4px 0;-webkit-tap-highlight-color:transparent;}
.tbar-title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;
  color:var(--text);flex:1;letter-spacing:.02em;}

/* ── Game Header (home) ── */
.game-hdr{display:flex;align-items:center;gap:10px;
  padding:env(safe-area-inset-top,44px) 14px 12px;flex-shrink:0;}
.avatar{width:52px;height:52px;border-radius:16px;overflow:hidden;
  border:2px solid var(--gold);flex-shrink:0;padding:4px;}
.avatar svg{display:block;width:100%;height:100%;}
.hdr-info{flex:1;}
.hdr-name{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;
  color:var(--text);line-height:1;letter-spacing:.02em;}
.hdr-date{font-size:11px;color:var(--muted);margin-top:2px;}
.hdr-badges{display:flex;gap:6px;align-items:center;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;
  border-radius:20px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;}
.badge-fire{background:rgba(245,158,11,.18);border:1px solid rgba(245,158,11,.35);color:var(--amber);}
.badge-xp{background:rgba(197,165,114,.14);border:1px solid rgba(197,165,114,.3);color:var(--gold);}
.hdr-theme{background:rgba(var(--overlay-rgb),.08);border:1px solid var(--border);
  border-radius:12px;padding:6px 10px;font-size:14px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;flex-shrink:0;}
.hdr-lock{background:none;border:none;font-size:16px;cursor:pointer;
  opacity:.22;padding:4px;-webkit-tap-highlight-color:transparent;flex-shrink:0;}

/* ── XP Level Card ── */
.xp-card{background:linear-gradient(135deg,rgba(197,165,114,.18) 0%,rgba(var(--tint-rgb),.9) 60%);
  border:1.5px solid rgba(197,165,114,.3);border-radius:var(--r);
  padding:14px 16px;margin-bottom:14px;}
.xp-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.level-badge{background:linear-gradient(135deg,var(--gold),var(--goldbright));
  color:#16141E;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;padding:5px 14px;border-radius:20px;
  white-space:nowrap;}
.xp-info{flex:1;text-align:right;}
.xp-nums{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--sub);}
.xp-next{font-size:10px;color:var(--muted);margin-top:1px;}
.xp-bar-wrap{position:relative;height:10px;background:rgba(var(--overlay-rgb),.08);
  border-radius:20px;overflow:hidden;}
.xp-bar-fill{height:100%;background:linear-gradient(90deg,#C5A572,#D4B87A,#E8C98A);
  border-radius:20px;transition:width .5s ease;
  box-shadow:0 0 8px rgba(197,165,114,.5);}

/* ── Verse card (game "daily message" style) ── */
.verse-card{background:linear-gradient(135deg,rgba(74,144,217,.18) 0%,rgba(var(--tint-rgb),.9) 70%);
  border:1.5px solid rgba(74,144,217,.28);border-radius:var(--r);
  padding:14px 16px;margin-bottom:14px;display:flex;align-items:flex-start;gap:10px;}
.verse-cross{font-size:26px;flex-shrink:0;margin-top:2px;}
.verse-body{flex:1;}
.verse-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin-bottom:4px;}
.verse-txt{font-size:13px;color:var(--text);line-height:1.5;font-style:italic;}
.verse-ref{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  color:var(--gold);margin-top:4px;}

/* ── Section label ── */
.sec{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:800;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}

/* ── Game category cards ── */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.cat-card{border-radius:var(--r);padding:16px 14px 18px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:transform .1s;position:relative;
  overflow:hidden;border:1.5px solid var(--ac-border);}
.cat-card:active{transform:scale(.97);}
.cat-card::before{content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,var(--ac-glow) 0%,rgba(22,20,30,.95) 65%);
  pointer-events:none;}
.cat-card-inner{position:relative;z-index:1;}
.cat-icon{font-size:32px;display:block;margin-bottom:8px;}
.cat-lbl{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;
  text-transform:uppercase;letter-spacing:.04em;color:var(--ac);margin-bottom:3px;}
.cat-stat{font-size:10px;color:var(--sub);}
.cat-pbar{margin-top:10px;height:5px;background:rgba(var(--overlay-rgb),.1);
  border-radius:10px;overflow:hidden;}
.cat-pfill{height:100%;background:var(--ac);border-radius:10px;opacity:.85;}

/* ── Habits strip ── */
.hab-strip{background:linear-gradient(135deg,rgba(245,158,11,.18) 0%,rgba(var(--tint-rgb),.9) 65%);
  border:1.5px solid rgba(245,158,11,.3);border-radius:var(--r);
  padding:14px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:transform .1s;margin-bottom:14px;}
.hab-strip:active{transform:scale(.98);}
.hab-top{display:flex;align-items:center;gap:10px;}
.hab-icon{font-size:28px;}
.hab-info{flex:1;}
.hab-lbl{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:800;
  text-transform:uppercase;letter-spacing:.04em;color:var(--amber);}
.hab-sub{font-size:10px;color:var(--sub);margin-top:2px;}
.hab-pct{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;color:var(--amber);}
.hab-dots{display:flex;gap:4px;margin-top:10px;}
.hdot{height:6px;border-radius:3px;flex:1;}

/* ── Checklist (game mission style) ── */
.chk-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.chk-row{display:flex;align-items:center;gap:10px;padding:12px 14px;
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .1s;}
.chk-row:active{transform:scale(.98);}
.chk-box{width:24px;height:24px;border-radius:8px;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-size:13px;font-weight:700;color:white;transition:all .15s;}
.row-lbl{font-size:14px;font-weight:500;color:var(--text);flex:1;}
.row-lbl.done{color:var(--muted);text-decoration:line-through;}
.row-cat{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:800;
  text-transform:uppercase;letter-spacing:.06em;}

/* ── Goals toggle ── */
.g-toggle{display:flex;background:var(--card);border-radius:var(--r);
  padding:4px;gap:4px;margin-bottom:16px;border:1px solid var(--border);}
.gt{flex:1;text-align:center;padding:9px 4px;border-radius:var(--r-sm);
  font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;}
.gt.on{background:linear-gradient(135deg,rgba(197,165,114,.25),rgba(197,165,114,.1));
  color:var(--gold);border:1px solid rgba(197,165,114,.3);}

/* ── Time view cards ── */
.t-sec{margin-bottom:22px;}
.t-hd{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.t-lbl{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;}
.t-line{flex:1;height:1px;opacity:.15;}
.t-cnt{font-size:10px;color:var(--muted);}
.t-card{background:var(--card);border-radius:18px;border-left:4px solid var(--tc);
  padding:14px 16px;margin-bottom:8px;border:1.5px solid rgba(var(--overlay-rgb),.07);
  border-left:4px solid var(--tc);cursor:pointer;}
.tc-top{display:flex;align-items:flex-start;gap:10px;}
.tc-icon{font-size:18px;flex-shrink:0;margin-top:2px;}
.tc-title{font-size:14px;font-weight:500;color:var(--text);line-height:1.35;flex:1;}
.tc-val{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;
  color:var(--tc);margin-top:5px;}
.tc-bar{height:4px;background:rgba(var(--overlay-rgb),.08);border-radius:4px;overflow:hidden;margin-top:8px;}
.tc-fill{height:100%;border-radius:4px;}
.tc-sub{font-size:10px;color:var(--muted);margin-top:5px;font-style:italic;}
.freq-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;
  background:rgba(74,144,217,.15);border:1px solid rgba(74,144,217,.25);color:var(--blue);
  font-size:9px;font-weight:800;font-family:'Barlow Condensed',sans-serif;
  letter-spacing:.06em;text-transform:uppercase;margin-left:6px;vertical-align:middle;}

/* ── Sport tabs ── */
.sport-tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;}
.s-tab{padding:7px 16px;border-radius:20px;font-family:'Barlow Condensed',sans-serif;
  font-size:12px;font-weight:800;letter-spacing:.06em;white-space:nowrap;
  cursor:pointer;border:1.5px solid;-webkit-tap-highlight-color:transparent;transition:all .15s;}
.s-tab.on{background:rgba(196,30,58,.18);border-color:rgba(196,30,58,.5);color:var(--red);}
.s-tab.off{border-color:var(--border);color:var(--muted);}

/* ── Goal cards ── */
.g-card{background:var(--card);border-radius:var(--r);padding:14px 16px;
  display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:transform .1s;
  border:1.5px solid var(--border);}
.g-card:active{transform:scale(.98);}
.g-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--red);
  flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;}
.g-dot.done{background:var(--red);}
.g-dot.done::after{content:'✓';font-size:11px;font-weight:700;color:white;}
.g-title{font-size:14px;font-weight:500;color:var(--text);}
.g-title.done{color:var(--muted);text-decoration:line-through;}
.g-meta{font-size:11px;color:var(--muted);margin-top:3px;}
.g-hor{display:inline-block;padding:3px 9px;border-radius:8px;
  background:rgba(52,168,110,.14);border:1px solid rgba(52,168,110,.3);
  color:#5FBF8F;font-size:9px;font-weight:800;font-family:'Barlow Condensed',sans-serif;
  letter-spacing:.06em;text-transform:uppercase;margin-top:6px;}
.g-pbar{height:4px;background:rgba(var(--overlay-rgb),.08);border-radius:4px;overflow:hidden;margin-top:10px;}
.g-pfill{height:100%;background:var(--red);border-radius:4px;}
.g-chev{color:var(--muted);font-size:20px;align-self:center;}
.add-btn{padding:14px;border-radius:var(--r);text-align:center;
  font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;
  color:#5FBF8F;letter-spacing:.06em;cursor:pointer;margin-top:4px;
  background:rgba(52,168,110,.12);border:1.5px solid rgba(52,168,110,.3);
  -webkit-tap-highlight-color:transparent;transition:transform .1s;}
.add-btn:active{transform:scale(.98);}

/* ── Habits screen ── */
.hero-sec{padding:0 0 16px;border-bottom:1px solid var(--border);margin-bottom:16px;}
.hero-sub{font-size:12px;color:var(--muted);margin-bottom:10px;}
.hab-manage{display:flex;align-items:center;gap:10px;padding:12px 16px;
  background:var(--card);border:1.5px solid var(--border);border-radius:16px;
  margin-bottom:8px;}

/* ── Add Goal ── */
.gtype-row{display:flex;gap:10px;margin-bottom:20px;}
.gtype{flex:1;padding:14px 10px;border-radius:var(--r);border:1.5px solid var(--border);
  background:var(--card);text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:all .15s;}
.gtype.on{border-color:var(--red);background:rgba(196,30,58,.1);}
.gtype-ico{font-size:26px;display:block;margin-bottom:6px;}
.gtype-lbl{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;
  text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
.gtype.on .gtype-lbl{color:var(--red);}
.gtype-desc{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.3;}
.freq-row{display:flex;align-items:center;gap:10px;padding:16px;
  background:var(--card);border-radius:var(--r);margin-bottom:16px;
  border:1.5px solid var(--border);}
.freq-adj{background:var(--card2);border:none;border-radius:12px;
  width:40px;height:40px;font-size:22px;color:var(--text);cursor:pointer;
  -webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;}
.freq-n{font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:800;
  color:var(--blue);flex:1;text-align:center;}
.freq-note{font-size:12px;color:var(--blue);background:rgba(74,144,217,.08);
  border:1.5px solid rgba(74,144,217,.2);border-radius:var(--r-sm);
  padding:10px 14px;line-height:1.55;margin-bottom:16px;}
.hor-row{display:flex;gap:6px;margin-bottom:16px;}
.h-btn{flex:1;padding:9px 4px;border-radius:var(--r-sm);border:1.5px solid var(--border);
  background:var(--card);color:var(--muted);font-family:'Barlow Condensed',sans-serif;
  font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  cursor:pointer;text-align:center;transition:all .15s;-webkit-tap-highlight-color:transparent;}
.h-btn.on{border-color:var(--red);background:rgba(196,30,58,.1);color:var(--red);}
.ex-hd{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.ex-note{font-size:11px;color:var(--sub);background:var(--card);border-radius:var(--r-sm);
  padding:10px 14px;margin-bottom:10px;line-height:1.5;border:1px solid var(--border);}
.ex-item{background:var(--card);border:1.5px solid var(--border);border-radius:16px;
  padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:10px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s;}
.ex-item:active{transform:scale(.98);}
.ex-item.on{border-color:var(--red);background:rgba(196,30,58,.08);}
.ex-txt{font-size:14px;color:var(--text);flex:1;}
.ex-add{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-size:13px;color:var(--muted);}
.ex-item.on .ex-add{background:var(--red);border-color:var(--red);color:white;}
.ex-item.on .ex-add::after{content:'✓';}
.form-lbl{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.f-area{width:100%;background:var(--card);border:1.5px solid var(--border);
  border-radius:var(--r-sm);color:var(--text);font-family:inherit;font-size:14px;
  padding:14px;outline:none;resize:none;min-height:80px;transition:border-color .15s;}
.f-area:focus{border-color:rgba(197,165,114,.4);}

/* ── Stats ── */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.stat-box{background:var(--card);border-radius:var(--r);padding:16px 14px;
  border:1.5px solid var(--border);}
.stat-big{font-family:'Barlow Condensed',sans-serif;font-size:46px;
  font-weight:800;color:var(--gold);line-height:1;}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:3px;}
.week-grid{display:flex;gap:5px;}
.wk-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.wk-d{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:800;
  text-transform:uppercase;color:var(--muted);}
.wk-bar{width:100%;border-radius:6px;}
.wk-xp{font-size:8px;color:var(--muted);}
.lvl-row{display:flex;align-items:center;gap:10px;padding:12px 16px;
  border-bottom:1px solid var(--border);}
.lvl-row:last-child{border-bottom:none;}
.lvl-name{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;width:88px;}
.lvl-xp{font-size:11px;color:var(--muted);flex:1;}
.lvl-tag{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;
  color:var(--gold);padding:3px 10px;border-radius:8px;
  background:rgba(197,165,114,.15);border:1px solid rgba(197,165,114,.25);}

/* ── Parent PIN overlay ── */
.pin-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  z-index:300;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:24px;animation:fUp .2s ease;}
.pin-modal{background:var(--card);border-radius:28px;padding:28px 24px;

        if(d[k]!==undefined) S[k]=d[k];
      });

    }
  }).catch(function(e){console.error('Load state failed',e);});

  db.doc(window.APP_CONFIG.docIds.security).get().then(function(snap){
    S.pin = (snap.exists && snap.data().pin) ? snap.data().pin : '1234';
    if(!snap.exists) db.doc(window.APP_CONFIG.docIds.security).set({pin:'1234'});
  }).catch(function(e){console.error('Load PIN failed',e);});

/* ── Daily verse — Our Manna API ── */
function fetchDailyVerse(){
  var todayKey='verse_'+new Date().toISOString().slice(0,10);
  var cached=null;
  try{cached=JSON.parse(localStorage.getItem(todayKey)||'null');}catch(e){}
  if(cached){ S.verse=cached; return; }

  fetch('https://beta.ourmanna.com/api/v1/get/?format=json&order=daily')
    .then(function(r){return r.json();})
    .then(function(data){
      var v=data && data.verse && data.verse.details;
      if(v && v.text){
        S.verse={text:v.text, ref:v.reference+' · '+(v.version||'NIV')};
        localStorage.setItem(todayKey, JSON.stringify(S.verse));
        if(S.scr==='verse'||S.tab==='home') render();
      }
    })
    .catch(function(e){ console.warn('Verse fetch failed, using fallback verse.',e); });
}

/* ── Gemini goal suggestions — called once at onboarding ── */
function fetchGeminiSuggestions(onboardingAnswers){
  var key=window.APP_CONFIG && window.APP_CONFIG.geminiApiKey;
  if(!key || key==='PASTE_GEMINI_API_KEY') return Promise.resolve(null); // fall back to static EXAMPLES

  var prompt='You are helping a 13-year-old athlete/musician set personal goals. '+
    'He plays soccer, baseball, basketball, cross country and track, and is in band. '+
    'His answers about himself: '+JSON.stringify(onboardingAnswers)+'. '+
    'Write 4 short (under 12 words), specific, encouraging goal suggestions for EACH of these time '+
    'horizons: yearly, monthly, weekly. Non-prescriptive — suggestions, not orders. '+
    'Respond ONLY with JSON in the shape {"yearly":[...4 strings],"monthly":[...4],"weekly":[...4]} — no markdown fences, no preamble.';

  return fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key='+key,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})
  })
  .then(function(r){return r.json();})
  .then(function(data){
    var txt=data.candidates && data.candidates[0] && data.candidates[0].content.parts[0].text;
    var clean=(txt||'').replace(/```json|```/g,'').trim();
    var parsed=JSON.parse(clean);
    if(parsed.yearly && parsed.monthly && parsed.weekly) return parsed;
    throw new Error('Unexpected Gemini response shape');
  })
  .catch(function(e){
    console.warn('Gemini suggestion call failed, using fallback EXAMPLES.',e);
    return null;
  });
}

/* ── Push notifications (FCM) ──
   The client can only REQUEST permission and register a token here.
   Actually sending "Nolan finished all his habits!" to Matt & Jen's
   phones needs a small server-side trigger — see /functions/index.js
   in the project for a Cloud Function that watches this Firestore
   doc and sends the push. That function is NOT something a static
   GitHub Pages site can run; it needs to be deployed to Firebase
   Cloud Functions (see SETUP.md, Step 5). */
function setupPush(parentDocId){
  if(!messaging || !window.APP_CONFIG.vapidKey || window.APP_CONFIG.vapidKey==='PASTE_VAPID_KEY') return;
  Notification.requestPermission().then(function(perm){
    if(perm!=='granted') return;
    messaging.getToken({vapidKey:window.APP_CONFIG.vapidKey}).then(function(token){
      if(token && db) db.doc(parentDocId).set({fcmToken:token},{merge:true});
    }).catch(function(e){console.warn('Push token fetch failed',e);});
  });
}

function goalChildren(id){
  return S.goals.filter(function(g){return g.parentId===id;});
}
function goalProgress(g){
  var kids=goalChildren(g.id);
  if(!kids.length) return g.pct;
  var sum=kids.reduce(function(acc,k){return acc+goalProgress(k);},0);
  return Math.round(sum/kids.length);
}
function goalIsDone(g){
  var kids=goalChildren(g.id);
  if(!kids.length) return g.done;
  return kids.every(function(k){return goalIsDone(k);});
}

function sCatDetail(){
  var key=S.curCat||'athletics';
  var c=CATS[key];
  var isAthletics=key==='athletics';
  var activeSportList=SPORTS.filter(function(s){return s.pinned||S.activeSports[s.key];});
  if(isAthletics && !S.activeSports[S.curSport]) S.curSport='soccer';
  var goals=S.goals.filter(function(g){
    if(g.cat!==key) return false;
    if(isAthletics) return (g.sport||'soccer')===S.curSport;
    return true;
  });
  var done=goals.filter(function(g){return goalIsDone(g);}).length;

  function gcard(g,depth){
    var pct=goalProgress(g);
    var isDone=goalIsDone(g);
    var kids=goalChildren(g.id);
    return '<div class="g-card" data-editg="'+g.id+'" style="'+(depth?'margin-left:'+(depth*18)+'px;border-left:2px solid '+c.clr+'44':'')+'">'+
      '<div class="g-dot'+(isDone?' done':'')+'" style="border-color:'+c.clr+';'+(isDone?'background:'+c.clr:'')+'"></div>'+
      '<div style="flex:1"><div class="g-title'+(isDone?' done':'')+'">'+esc(g.t)+'</div>'+
        (isDone?'<div class="g-meta">Completed ✓</div>':
          '<div class="g-hor">'+g.hor+(kids.length?' · rolls up from '+kids.length+' linked goal'+(kids.length>1?'s':''):'')+'</div>'+
          '<div class="g-pbar"><div class="g-pfill" style="width:'+pct+'%;background:'+c.clr+'"></div></div>'+
          '<div class="g-meta" style="margin-top:4px">'+pct+'% complete</div>')+
      '</div><span class="g-chev">›</span></div>';
  }

  var yearly=goals.filter(function(g){return g.hor==='Yearly';});
  var linkedIds={};
  var tree='';
  yearly.forEach(function(y){
    tree+=gcard(y,0);
    linkedIds[y.id]=true;
    var months=goalChildren(y.id).filter(function(g){return g.cat===key && (!isAthletics||(g.sport||'soccer')===S.curSport);});
    months.forEach(function(m){
      tree+=gcard(m,1);
      linkedIds[m.id]=true;
      var weeks=goalChildren(m.id).filter(function(g){return g.cat===key && (!isAthletics||(g.sport||'soccer')===S.curSport);});
      weeks.forEach(function(w){
        tree+=gcard(w,2);
        linkedIds[w.id]=true;
      });
    });
  });
  var orphans=goals.filter(function(g){return !linkedIds[g.id];});
  var glist=tree+(orphans.length?
    '<div class="sec" style="margin-top:14px;font-size:11px">Not yet linked to a bigger goal</div>'+orphans.map(function(g){return gcard(g,0);}).join('')
    :'');

  var subLine={
    athletics:'Performance, skills, and training goals',
    faith:'Prayer, scripture, and character goals',
    academics:'Grades, study habits, and schoolwork goals',
    creative:'Practice, performance, and creative goals'
  }[key];

  var sportTabs='';
  if(isAthletics){
    sportTabs='<div class="sport-tabs">'+activeSportList.map(function(s){
      return '<div class="s-tab '+(s.key===S.curSport?'on':'off')+'" data-sporttab="'+s.key+'">'+s.l+'</div>';
    }).join('')+'</div>';
  }

  return '<div style="display:flex;flex-direction:column;height:100%">'+
    '<div class="topbar"><button class="back" data-tab="goals">‹ Goals</button>'+
      '<span class="tbar-title" style="color:'+c.clr+'">'+c.ico+' '+c.l+'</span><div id="avatar-btn" style="cursor:pointer">'+logo(32)+'</div></div>'+
    '<div class="scroll fin">'+
      '<div class="hero-sec">'+
        '<div class="hero-sub">'+subLine+'</div>'+
        '<div style="display:flex;gap:14px;align-items:baseline">'+
          '<div><span style="font-family:Barlow Condensed,sans-serif;font-size:26px;font-weight:800;color:var(--text)">'+done+'</span><span style="font-size:10px;color:var(--muted);margin-left:3px">complete</span></div>'+
          '<div><span style="font-family:Barlow Condensed,sans-serif;font-size:26px;font-weight:800;color:var(--text)">'+(goals.length-done)+'</span><span style="font-size:10px;color:var(--muted);margin-left:3px">in progress</span></div>'+
          '<div style="font-family:Barlow Condensed,sans-serif;font-size:22px;font-weight:800;color:'+c.clr+'">'+(goals.length?Math.round(done/goals.length*100):0)+'%</div>'+
        '</div>'+
      '</div>'+
      sportTabs+glist+
      '<div class="add-btn" data-go="addg">+ Add '+(isAthletics?activeSportList.find(function(s){return s.key===S.curSport;}).l.replace(/^\S+\s/,''):c.l)+' Goal</div>'+
    '</div>'+nav()+'</div>';

function showChangePin(){
  var step='current', cur='', next='', confirmPin='';
  var ov=document.createElement('div');
  ov.className='pin-overlay';
  document.body.appendChild(ov);

  function draw(){
    var titles={current:'Enter Current PIN', next:'Choose New PIN', confirm:'Confirm New PIN'};
    var val = step==='current'?cur:step==='next'?next:confirmPin;
    ov.innerHTML='<div class="pin-modal">'+
      '<button class="pin-x" id="cpx">✕</button>'+
      '<div style="font-size:40px;margin-bottom:10px">🔑</div>'+
      '<div style="font-family:Barlow Condensed,sans-serif;font-size:24px;font-weight:800;color:var(--text);margin-bottom:4px">'+titles[step]+'</div>'+
      '<div style="font-size:13px;color:var(--muted)">'+(step==='current'?'Shared by Matt & Jen':'4 digits')+'</div>'+
      '<div class="pin-dots">'+[0,1,2,3].map(function(i){return '<div class="pdot'+(i<val.length?' on':'')+'"></div>';}).join('')+'</div>'+
      '<div class="pin-grid">'+[1,2,3,4,5,6,7,8,9].map(function(n){return '<button class="pkey" data-cpk="'+n+'">'+n+'</button>';}).join('')+
        '<button class="pkey sm" data-cpk="clr">CLR</button><button class="pkey" data-cpk="0">0</button><button class="pkey sm" data-cpk="del">⌫</button></div>'+
      '</div>';
    document.getElementById('cpx').onclick=function(){ov.remove();};
    ov.querySelectorAll('[data-cpk]').forEach(function(el){
      el.onclick=function(){
        var k=el.dataset.cpk;
        var v = step==='current'?cur:step==='next'?next:confirmPin;
        if(k==='clr') v='';
        else if(k==='del') v=v.slice(0,-1);
        else if(v.length<4) v+=k;
        if(step==='current') cur=v; else if(step==='next') next=v; else confirmPin=v;
        draw();
        if(v.length===4){
          setTimeout(function(){
            if(step==='current'){
              if(cur===S.pin){ step='next'; draw(); }
              else{ cur=''; draw(); toast('Incorrect current PIN','#EF4444'); }
            }else if(step==='next'){
              step='confirm'; draw();
            }else{
              if(confirmPin===next){
                fbSavePin(next).then(function(){
                  ov.remove(); toast('PIN updated ✓','#30D158');
                });
              }else{
                next='';confirmPin='';step='next';draw();
                toast('PINs did not match — try again','#EF4444');
              }
            }
          },180);
        }
      };
    });
  }
  draw();
}

  ov.innerHTML='<div class="pin-modal">'+

    '<div style="font-size:40px;margin-bottom:10px">🔒</div>'+
    '<div style="font-family:Barlow Condensed,sans-serif;font-size:24px;font-weight:800;color:var(--text);margin-bottom:4px">Parent View</div>'+
    '<div style="font-size:13px;color:var(--muted)">Enter PIN to continue</div>'+
    '<div class="pin-dots">'+[0,1,2,3].map(function(i){return '<div class="pdot" id="pd'+i+'"></div>';}).join('')+'</div>'+
    '<div class="pin-grid">'+[1,2,3,4,5,6,7,8,9].map(function(n){return '<button class="pkey" data-pk="'+n+'">'+n+'</button>';}).join('')+
      '<button class="pkey sm" data-pk="clr">CLR</button><button class="pkey" data-pk="0">0</button><button class="pkey sm" data-pk="del">⌫</button></div>'+
    (S.pin==='1234'?'<div style="font-size:11px;color:var(--muted);margin-top:14px">Default PIN: 1234 — change it in Parent View → Change PIN</div>':'')+'</div>';

  document.body.appendChild(ov);
  function dots(){[0,1,2,3].forEach(function(i){var d=document.getElementById('pd'+i);if(d)d.className='pdot'+(i<pin.length?' on':'');});}
  document.getElementById('pinx').onclick=function(){ov.remove();};
  ov.querySelectorAll('[data-pk]').forEach(function(el){
    el.onclick=function(){
      var k=el.dataset.pk;
      if(k==='clr'){pin='';dots();return;}
      if(k==='del'){pin=pin.slice(0,-1);dots();return;}
      if(pin.length>=4) return;
      pin+=k;dots();
      if(pin.length===4){
        setTimeout(function(){
          if(pin===S.pin){ov.remove();S.scr='pdash';render();}
          else{pin='';dots();toast('Incorrect PIN','#EF4444');}
        },180);
      }
    };
  });
}

function showProfile(){

      '<p>Wanting is "I hope I make the top team." Deciding is "I\'m going to put in extra work today, even when I don\'t feel like it."</p>'+
      '<p>The gap between who you are now and who you want to be is closed one small decision at a time. <em>A thousand small ones.</em></p>'+
      '<p>That\'s what this app tracks. Not your talent. Your decisions.</p>'],
    ['s2','⚡','How XP Works','<p>XP is proof you showed up. Every action earns a different amount based on how much it matters.</p><div style="margin-bottom:12px">'+xpRows+'</div><p>The math is simple. <em>Show up every day and the levels take care of themselves.</em></p>'],
    ['s3','🏆','What Each Level Means','<p>Levels aren\'t just numbers. Each one represents something real about where you are in the work.</p><div>'+lvlExp+'</div>'],
    ['s4','🎯','Goals vs Habits',
      '<p><strong>Goals are where you\'re going.</strong> Outcomes you work toward over weeks, months, or a whole year.</p>'+
      '<p><strong>Habits are how you get there.</strong> The daily actions that close the gap.</p>'+
      '<p><em>You can\'t control whether you make the team. You can control whether you practice.</em></p>'+
      '<p><strong>Repeating goals</strong> — like "practice 3x per week" — are goals that become habits.</p>'+
      '<p><strong>How the three time frames connect:</strong> a Weekly goal can link up to a Monthly goal, and a Monthly goal can link up to a Yearly one. When they\'re linked, the bigger goal\'s progress bar moves automatically as the smaller one does — you never have to update it by hand. Finish this week\'s goal, and the month moves. Finish the month, and the year moves.</p>'],
    ['s5','📊','Your Stats Explained','<div>'+statExp+'</div>'],
    ['s6','💪','Why Habits Compound',
      '<p>Making your bed doesn\'t make you better at your sport. Not directly. But <em>it makes you someone who does what they said they\'d do.</em></p>'+
      '<p>That identity transfers to everything else. <strong>They\'re building the person who can do the hard things.</strong></p>'+
      '<p>The goals tell you where you\'re going. The habits build the version of you who can actually get there.</p>']
  ].map(function(s){
    return '<div class="pb-section"><div class="pb-sec-hd" data-psec="'+s[0]+'">'+
      '<div class="pb-sec-ico">'+s[1]+'</div><div class="pb-sec-title">'+s[2]+'</div>'+
      '<div class="pb-sec-arrow" id="parr-'+s[0]+'">›</div></div>'+
      '<div class="pb-body" id="pbody-'+s[0]+'">'+s[3]+'</div></div>';
  }).join('');

  ov.innerHTML=
    '<div class="profile-hdr"><button class="profile-close" id="pf-close">✕</button>'+
      '<div class="profile-tabs">'+
        '<div class="ptab on" data-ptab="identity">Identity</div>'+
        '<div class="ptab" data-ptab="playbook">Playbook</div>'+
        '<div class="ptab" data-ptab="settings">Settings</div>'+
      '</div></div>'+
    '<div class="scroll fin" id="pf-identity" style="padding-top:14px">'+
      '<div class="id-hero"><div class="id-top"><div class="id-avatar">'+logo(64)+'</div>'+
        '<div><div class="id-name">Nolan Prather</div><div class="id-level">⚡ Amateur</div></div></div>'+
        '<div class="id-stats">'+
          '<div class="id-stat"><div class="id-stat-n" style="color:#F59E0B">'+S.streak+'</div><div class="id-stat-l">Day streak</div></div>'+
          '<div class="id-stat"><div class="id-stat-n" style="color:#C5A572">'+S.xp+'</div><div class="id-stat-l">Total XP</div></div>'+
          '<div class="id-stat"><div class="id-stat-n" style="color:#30D158">12</div><div class="id-stat-l">Perfect days</div></div>'+
        '</div></div>'+
      '<div class="sec">Your Commitments</div>'+
      (!S.identity.goal ?
        '<div class="commit-card" style="text-align:center">'+
          '<div style="font-size:32px;margin-bottom:8px">🎯</div>'+
          '<div style="font-family:Barlow Condensed,sans-serif;font-size:16px;font-weight:800;color:var(--text);margin-bottom:6px">You haven&rsquo;t set this up yet</div>'+
          '<div style="font-size:12px;color:var(--sub);margin-bottom:14px;line-height:1.5">Three quick questions that set the tone for your whole season.</div>'+
          '<button class="btn btn-red" id="setup-identity-btn">Set Up My Identity</button>'+
        '</div>'
        :
        '<div class="commit-card"><div class="commit-lbl" style="color:#C5A572">What you&rsquo;re working for</div>'+
          '<div class="commit-q">What\'s one thing you want badly enough to actually work for?</div>'+
          '<div class="commit-a">"'+esc(S.identity.goal)+'"</div></div>'+
        '<div class="commit-card"><div class="commit-lbl" style="color:#C41E3A">What&rsquo;s in the way</div>'+
          '<div class="commit-q">What\'s standing between you and that?</div>'+
          '<div class="commit-a">"'+esc(S.identity.obstacle)+'"</div></div>'+
        '<div class="commit-card"><div class="commit-lbl" style="color:#9B72CF">Who you&rsquo;re becoming</div>'+
          '<div class="commit-q">Who do you want to be by the end of this year?</div>'+
          '<div class="commit-a">"'+esc(S.identity.becoming)+'"</div></div>'+
        '<button class="btn btn-ghost" id="setup-identity-btn" style="margin-top:4px">✏️ Edit My Identity</button>'
      )+
      '<div style="height:16px"></div><div style="font-size:11px;color:#5E5A72;text-align:center;line-height:1.6">Season 1 · Aug–Dec 2025<br>Started Aug 1, 2025</div>'+
    '</div>'+
    '<div class="scroll fin" id="pf-playbook" style="display:none;padding-top:14px">'+
      '<div class="pb-intro"><strong>This is your Playbook.</strong> Not a manual. Not rules. Just the stuff that\'ll actually help you understand why this app exists and what it\'s trying to do for you. Read it when you\'re ready.</div>'+
      pbSections+
    '</div>'+
    '<div class="scroll fin" id="pf-settings" style="display:none;padding-top:14px">'+
      '<div class="sec">Display</div>'+
      '<div class="toggle-row"><div class="settings-ico">🌙</div><div class="toggle-body">'+
        '<div class="toggle-lbl">Dark Mode</div><div class="toggle-sub">Tap to switch — defaults to your phone\'s system setting</div></div>'+
        '<div class="toggle-sw'+(S.theme==='dark'?' on':'')+'" id="pf-theme-tog"></div></div>'+
      '<div class="sec">Active Sports</div>'+
      '<div class="season-card"><div style="font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:800;color:#4A90D9;margin-bottom:8px">⚽ Soccer is pinned year-round</div>'+
        '<div style="font-size:12px;color:#9B97B0;margin-bottom:12px;line-height:1.5">Toggle your other sports based on what\'s in season. Only active sports show goals and earn XP.</div>'+
        '<div class="sport-grid">'+
          SPORTS.map(function(s){
            var active=s.pinned||S.activeSports[s.key];
            return '<div class="sport-chip '+(active?'on':'off')+'" data-sporttoggle="'+s.key+'" style="'+(s.pinned?'opacity:.7;cursor:default':'')+'">'+s.l+'</div>';
          }).join('')+
        '</div></div>'+
      '<div class="sec">Account</div>'+
      '<div class="settings-row" id="pf-pin-row"><div class="settings-ico">🔒</div><div class="settings-body">'+
        '<div class="settings-lbl">Parent PIN</div><div class="settings-sub">Change the PIN for parent access</div></div>'+
        '<div class="settings-arrow">›</div></div>'+
      '<div class="settings-row"><div class="settings-ico">🔔</div><div class="settings-body">'+
        '<div class="settings-lbl">Notifications</div><div class="settings-sub">Manage what Matt & Jen get notified about</div></div>'+
        '<div class="settings-arrow">›</div></div>'+
    '</div>';

  document.body.appendChild(ov);

  ov.querySelectorAll('[data-ptab]').forEach(function(el){
    el.onclick=function(){
      ov.querySelectorAll('.ptab').forEach(function(p){p.classList.remove('on');});
      el.classList.add('on');
      var t=el.dataset.ptab;
      document.getElementById('pf-identity').style.display=t==='identity'?'block':'none';
      document.getElementById('pf-playbook').style.display=t==='playbook'?'block':'none';
      document.getElementById('pf-settings').style.display=t==='settings'?'block':'none';
    };
  });
  ov.querySelectorAll('[data-psec]').forEach(function(hd){
    hd.onclick=function(){
      var id=hd.dataset.psec;
      var body=document.getElementById('pbody-'+id), arr=document.getElementById('parr-'+id);
      var open=body.classList.contains('open');
      body.classList.toggle('open',!open); body.style.display=open?'none':'block';
      arr.classList.toggle('open',!open);
    };
  });
  var tt=document.getElementById('pf-theme-tog'); if(tt) tt.onclick=toggleTheme;
  ov.querySelectorAll('[data-sporttoggle]').forEach(function(chip){
    var key=chip.dataset.sporttoggle;
    if(SPORTS.find(function(s){return s.key===key;}).pinned) return; // pinned, not toggleable
    chip.onclick=function(){
      S.activeSports[key]=!S.activeSports[key];
      chip.classList.toggle('on');chip.classList.toggle('off');
      fbSaveState();
    };
  });
  var pinRow=document.getElementById('pf-pin-row'); if(pinRow) pinRow.onclick=function(){ov.remove();showPin();};
  var idBtn=document.getElementById('setup-identity-btn'); if(idBtn) idBtn.onclick=function(){ov.remove();showIdentityForm();};
  document.getElementById('pf-close').onclick=function(){ov.remove();};
}

function bind(){
  var app=document.getElementById('app');
  var vb=document.getElementById('vbtn');if(vb) vb.onclick=function(){S.tab='home';go('main');};
  var lb=document.getElementById('lock-btn');if(lb) lb.onclick=showPin;
  var lc=document.getElementById('lock-close');if(lc) lc.onclick=function(){S.tab='home';go('main');};
  var cr=document.getElementById('copy-rpt');if(cr) cr.onclick=function(){toast('Report copied!','#C5A572');};
  var cpb=document.getElementById('change-pin-btn');if(cpb) cpb.onclick=showChangePin;
  var avb=document.getElementById('avatar-btn');if(avb) avb.onclick=showProfile;
  var tb=document.getElementById('theme-btn');if(tb) tb.onclick=toggleTheme;

  app.querySelectorAll('[data-tab]').forEach(function(el){el.onclick=function(){S.tab=el.dataset.tab;go('main');};});
  app.querySelectorAll('[data-go]').forEach(function(el){el.onclick=function(){if(el.dataset.cat) S.curCat=el.dataset.cat;if(el.dataset.go==='addg'){S.linkParent=null;S.picked=null;S.addedTitle='';}go(el.dataset.go);};});
  app.querySelectorAll('[data-gtab]').forEach(function(el){el.onclick=function(){S.goalsTab=el.dataset.gtab;render();};});
  app.querySelectorAll('[data-gtype]').forEach(function(el){el.onclick=function(){S.goalType=el.dataset.gtype;render();};});
  app.querySelectorAll('[data-hor]').forEach(function(el){el.onclick=function(){S.hor=el.dataset.hor;S.picked=null;S.linkParent=null;render();};});
  app.querySelectorAll('[data-linkparent]').forEach(function(el){el.onclick=function(){S.linkParent=el.dataset.linkparent==='none'?null:el.dataset.linkparent;render();};});
  app.querySelectorAll('[data-sporttab]').forEach(function(el){el.onclick=function(){S.curSport=el.dataset.sporttab;render();};});
  app.querySelectorAll('[data-pick]').forEach(function(el){
    el.onclick=function(){S.picked=el.dataset.pick;S.addedTitle=el.dataset.etxt||'';render();};
  });
  app.querySelectorAll('[data-editg]').forEach(function(el){
    el.onclick=function(){showEditGoal(el.dataset.editg);};
  });
  var addHabitBtn=document.getElementById('add-habit-btn');
  if(addHabitBtn) addHabitBtn.onclick=function(){showHabitForm(null);};
  app.querySelectorAll('[data-edithab]').forEach(function(el){
    el.onclick=function(){showHabitForm(el.dataset.edithab);};
  });
  var addDayHabitBtn=document.getElementById('add-dayhabit-btn');
  if(addDayHabitBtn) addDayHabitBtn.onclick=function(){showDayHabitForm(null);};
  app.querySelectorAll('[data-editdayhab]').forEach(function(el){
    el.onclick=function(){showDayHabitForm(el.dataset.editdayhab);};
  });

  app.querySelectorAll('[data-tog]').forEach(function(el){
    el.onclick=function(){
      var id=el.dataset.tog;
      var h=S.habits.find(function(x){return x.id===id;})||S.dayHabits.find(function(x){return x.id===id;});
      if(!h) return;
      h.done=!h.done;
      if(h.done){
        S.xp+=5;
        toast('+5 XP · '+h.lbl,h.clr);
        if(todaysChecklist().every(function(x){return x.done;})){
          setTimeout(function(){S.xp+=20;toast('🎉 All missions done! +20 XP','#30D158');},1900);
        }
      }
      var xb=document.getElementById('xpbar');var xn=document.getElementById('xpnums');
      if(xb) xb.style.width=Math.round(S.xp/S.xpMax*100)+'%';
      if(xn) xn.textContent=S.xp+' / '+S.xpMax+' XP';
      var box=el.querySelector('.chk-box');var lbl=el.querySelector('.row-lbl');
      if(box){box.textContent=h.done?'✓':'';box.style.background=h.done?h.clr:'';box.style.borderColor=h.done?h.clr:'rgba(var(--overlay-rgb),.1)';box.className='chk-box'+(h.done?' done':'');}
      if(lbl) lbl.className='row-lbl'+(h.done?' done':'');
      fbSaveState(); // FIREBASE: persist + sync to parent views
    };
  });

  var fu=document.getElementById('fup');var fd=document.getElementById('fdown');var fn=document.getElementById('freqn');
  if(fu) fu.onclick=function(){if(S.freqN<7){S.freqN++;if(fn)fn.textContent=S.freqN;}};
  if(fd) fd.onclick=function(){if(S.freqN>1){S.freqN--;if(fn)fn.textContent=S.freqN;}};

  var cg=document.getElementById('custgoal');
  if(cg) cg.addEventListener('input',function(){
    S.addedTitle=cg.value;if(cg.value.trim()) S.picked=null;
    var sb=document.getElementById('saveg');
    if(sb){var ok=!!(S.picked||cg.value.trim().length>2);sb.className='btn btn-red'+(ok?'':' dim');sb.textContent=ok?'Save This Goal':'Select a suggestion or write your own';}
  });

  var sg=document.getElementById('saveg');
  if(sg) sg.onclick=function(){
    var t=S.addedTitle||(cg?cg.value:'');
    if(!t.trim()) return;
    S.goals.push({id:'g'+Date.now(),t:t.trim(),pct:0,done:false,hor:cap(S.hor),cat:S.curCat,parentId:S.linkParent||null,sport:S.curCat==='athletics'?S.curSport:undefined});
    toast('Goal added! 💪','#C41E3A');
    S.picked=null;S.addedTitle='';
    go('catdetail');
    fbSaveState(); // FIREBASE: persist + sync to parent views
  };
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}

render();
fetchDailyVerse();
fbInit();

// PWA service worker (offline shell caching + install-to-homescreen)
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(e){console.warn('SW registration failed',e);});
  });
}
</script>
</body>
